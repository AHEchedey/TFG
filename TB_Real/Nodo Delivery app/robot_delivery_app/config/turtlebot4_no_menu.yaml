# $ROS_WS/src/robot_delivery_app/config/turtlebot4_no_menu.yaml
turtlebot4_node:
  ros__parameters:
    # Menú vacío para que nunca se muestre el dock/undock de fábrica
    menu:
      entries: []

    # Acciones para los cuatro botones de la HMI
    buttons:
      hmi_1: ["Scroll Up"]
      hmi_2: ["Scroll Down"]
      hmi_3: ["Select"]   # (o “Guardar ubicación” cuando lo implementes)
      hmi_4: ["Back"]

      # Deja sin función los botones del Create 3
      create3_1: []
      create3_2: []
      create3_power: []

# ⬇️  ***NO toques nada a partir de aquí***
turtlebot4_base_node:
  ros__parameters:
    gpio:
      user_button_1: 19
      user_button_2: 16
      user_button_3: 26
      user_button_4: 20
      led_green_power: 17
      led_green_motors: 18
      led_green_comms: 27
      led_green_wifi: 24
      led_green_battery: 22
      led_red_battery: 23
      led_green_user_1: 25
      led_green_user_2: 6
      led_red_user_2: 21
      display_reset: 13
